{% extends "admin/base.html" %}
{% from "components/forms.html" import wtf_field %}
{% block admin %}
<h1>Municipios</h1>
<form method="post" class="card p-4 mt-4 grid gap-2 sm:grid-cols-[1fr_12rem_auto] items-end" novalidate>
  {{ form.hidden_tag() }}
  {{ wtf_field(form.name) }}
  {{ wtf_field(form.department) }}
  <button class="btn btn-primary mb-4">Agregar</button>
</form>
<div class="card divide-y divide-tierra-200 mt-4">
  {% for m, n in rows %}
  <a class="p-3 flex items-center justify-between no-underline text-tierra-900" href="{{ url_for('admin.municipality', mun_id=m.id) }}">
    <span class="font-bold">{{ m.name }} <span class="text-sm font-normal text-tierra-600">{{ m.department }}</span></span><span class="text-sm text-tierra-600">{{ n }} veredas ›</span></a>
  {% endfor %}
</div>
{% endblock %}
