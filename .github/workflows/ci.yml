name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install ruff black
      - run: ruff check app tests wsgi.py run.py
      - run: black --check app tests wsgi.py run.py

  tests:
    name: Pruebas (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Pruebas con cobertura
        run: pytest --cov=app --cov-report=term --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml

  tests-postgres:
    name: Pruebas (PostgreSQL)
    runs-on: ubuntu-latest
    # Verifica que consultas JSON y filtros funcionen igual en PostgreSQL. No bloquea hasta confirmarlo una vez.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campo
          POSTGRES_PASSWORD: campo
          POSTGRES_DB: campo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://campo:campo@localhost:5432/campo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/prod.txt -r requirements/dev.txt
      - run: pytest -q

  docker-build:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen de la app
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: campo-directo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Construir imagen de Nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/nginx/Dockerfile
          push: false
          tags: campo-directo-nginx:ci

  deploy:
    name: Desplegar al VPS
    runs-on: ubuntu-latest
    needs: [docker-build]
    # Solo si se despliega por SSH a un VPS propio. Con Coolify no hace falta: Coolify construye y despliega solo.
    # Para activarlo: en GitHub → Settings → Variables → crea USE_SSH_DEPLOY = true (y los secretos SSH_*).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.USE_SSH_DEPLOY == 'true'
    environment: production
    steps:
      - name: Actualizar, migrar y reiniciar por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch --all --prune
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml --env-file .env build
            # las migraciones se aplican al iniciar el contenedor app (entrypoint.sh)
            docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker compose -f docker-compose.prod.yml --env-file .env ps
            curl --fail --silent --retry 10 --retry-delay 5 --retry-connrefused "https://${{ secrets.DEPLOY_DOMAIN }}/health"
